<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowIQ - Add Loan Policy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div id="toast-container"></div>

    <div class="wrapper">
        {% include "sidebar.html" %}

        <div class="main">
            <div class="container-fluid mt-4 px-4">
                <div id="content-area">
                    <div class="mb-4">
                        <a href="/banks/{{ bank_id }}/policies" class="btn btn-light btn-sm"><i
                                class="fa-solid fa-arrow-left me-2"></i>Back to Policies</a>
                    </div>

                    <div class="card shadow-sm mb-5">
                        <div class="card-header bg-white py-3">
                            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-plus text-primary me-2"></i>Add Loan Policy
                            </h5>
                        </div>
                        <div class="card-body">
                            <form action="/banks/{{ bank_id }}/policies/add" method="POST">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label small fw-semibold text-secondary">Loan Type *</label>
                                        <select name="loan_type" class="form-select" required>
                                            <option value="Home Loan">Home Loan</option>
                                            <option value="Personal Loan">Personal Loan</option>
                                            <option value="Business Loan">Business Loan</option>
                                            <option value="Car Loan">Car Loan</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-semibold text-secondary">Min Credit Score
                                            (CIBIL) *</label>
                                        <input type="number" name="min_cibil" class="form-control" value="700" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-semibold text-secondary">Max Credit Score
                                            (CIBIL) *</label>
                                        <input type="number" name="max_cibil" class="form-control" value="900" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-semibold text-secondary">Min Monthly Net
                                            Income (₹) *</label>
                                        <input type="number" name="min_income" class="form-control" value="25000"
                                            required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-semibold text-secondary">Max Loan Amount (₹)
                                            *</label>
                                        <input type="number" name="max_loan_amount" class="form-control"
                                            value="10000000" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-semibold text-secondary">Interest Rate (%)
                                            *</label>
                                        <input type="number" step="0.01" name="interest_rate" class="form-control"
                                            value="8.75" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-semibold text-secondary">Processing Fee (₹)
                                            *</label>
                                        <input type="number" step="0.01" name="processing_fee" class="form-control"
                                            value="2500" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-semibold text-secondary">Max Loan-to-Value LTV
                                            (%) *</label>
                                        <input type="number" step="0.1" name="max_ltv" class="form-control" value="80"
                                            required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-semibold text-secondary">Min Age (Years)
                                            *</label>
                                        <input type="number" name="min_age" class="form-control" value="21" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-semibold text-secondary">Max Age (Years)
                                            *</label>
                                        <input type="number" name="max_age" class="form-control" value="65" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-semibold text-secondary">Min Work Experience
                                            (Years) *</label>
                                        <input type="number" name="minimum_work_experience_years" class="form-control"
                                            value="2" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-semibold text-secondary">Max FOIR (%)
                                            *</label>
                                        <input type="number" step="0.1" name="maximum_foir" class="form-control"
                                            value="50" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-semibold text-secondary">Supported Employment
                                            Types (Comma separated) *</label>
                                        <input type="text" name="employment_types" class="form-control"
                                            value="Salaried, Self-Employed" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-semibold text-secondary">Supported Property
                                            Types (Comma separated) *</label>
                                        <input type="text" name="property_types" class="form-control"
                                            value="Residential, Commercial" required>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-semibold text-secondary">Required Documents
                                            (Comma separated) *</label>
                                        <input type="text" name="required_documents" class="form-control"
                                            value="PAN Card, Aadhaar Card, Income Proof, Bank Statement" required>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small fw-semibold text-secondary">Min Tenure (Months)
                                            *</label>
                                        <input type="number" name="min_tenure" class="form-control" value="12" required>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small fw-semibold text-secondary">Max Tenure (Months)
                                            *</label>
                                        <input type="number" name="max_tenure" class="form-control" value="240"
                                            required>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small fw-semibold text-secondary">Prepayment Charges
                                            *</label>
                                        <input type="text" name="prepayment_charges" class="form-control" value="Nil"
                                            required>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small fw-semibold text-secondary">Foreclosure Charges
                                            *</label>
                                        <input type="text" name="foreclosure_charges" class="form-control" value="Nil"
                                            required>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-semibold text-secondary">Special Features /
                                            Advantages</label>
                                        <input type="text" name="special_features" class="form-control" value="Nil">
                                    </div>
                                </div>
                                <div class="mt-4">
                                    <button type="submit" class="btn btn-primary px-4 py-2"><i
                                            class="fa-solid fa-save me-2"></i>Save Policy</button>
                                    <a href="/banks/{{ bank_id }}/policies"
                                        class="btn btn-outline-secondary px-4 py-2">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
