<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowIQ - Edit Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div id="toast-container"></div>

    <div class="wrapper">
        {% include "sidebar.html" %}

        <div class="main">
            <div class="container-fluid mt-4 px-4">
                <div id="content-area">
                    <div class="mb-4">
                        <a href="/banks/" class="btn btn-light btn-sm"><i class="fa-solid fa-arrow-left me-2"></i>Back
                            to Banks</a>
                    </div>

                    <div class="card shadow-sm max-width-md" style="max-width: 600px;">
                        <div class="card-header bg-white py-3">
                            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-pen-to-square text-primary me-2"></i>Edit
                                Bank Profile</h5>
                        </div>
                        <div class="card-body">
                            <form action="/banks/{{ bank.id }}/edit" method="POST">
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label class="form-label small fw-semibold text-secondary">Bank Name *</label>
                                        <input type="text" name="name" class="form-control" value="{{ bank.name }}"
                                            required>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-semibold text-secondary">Website URL</label>
                                        <input type="url" name="website" class="form-control"
                                            value="{{ bank.website or '' }}">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-semibold text-secondary">Logo URL</label>
                                        <input type="text" name="logo" class="form-control"
                                            value="{{ bank.logo or '' }}">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-semibold text-secondary">Status</label>
                                        <select name="status" class="form-select">
                                            <option value="active" {% if bank.status=='active' %}selected{% endif %}>
                                                Active</option>
                                            <option value="inactive" {% if bank.status=='inactive' %}selected{% endif
                                                %}>Inactive</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="mt-4">
                                    <button type="submit" class="btn btn-primary px-4 py-2"><i
                                            class="fa-solid fa-save me-2"></i>Update Bank</button>
                                    <a href="/banks/" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
