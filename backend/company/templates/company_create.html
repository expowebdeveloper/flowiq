<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowIQ – Add Company</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div id="toast-container"></div>

<div class="wrapper">
    {% include "sidebar.html" %}

    <div class="main">

        <nav class="navbar px-4 py-3">
            <h5 class="mb-0 fw-bold text-slate-800">
                <i class="fa-solid fa-plus me-2 text-primary"></i>Add Company
            </h5>
            <a href="/companies/" class="btn btn-sm btn-outline-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Companies
            </a>
        </nav>

        <div class="container-fluid p-4">
            <div class="row justify-content-center">
                <div class="col-xl-9">
                    <div class="card">
                        <div class="card-header">
                            <h6 class="mb-0 fw-bold">Company Profile Details</h6>
                        </div>
                        <div class="card-body p-4">

                            <form action="/companies/create" method="post" enctype="multipart/form-data">

                                <div class="row g-3">
                                    <div class="col-md-6">

                                        <label class="form-label">Company Name *</label>

                                        <div class="input-group">

                                            <input
                                                id="company-name"
                                                type="text"
                                                name="company_name"
                                                class="form-control"
                                                placeholder="e.g. Acme Corp"
                                                required>

                                            <button
                                                type="button"
                                                id="fetch-company"
                                                class="btn btn-primary">

                                                Fetch Details

                                            </button>

                                        </div>

                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Company Type</label>
                                        <select name="company_type" class="form-select">
                                            <option value="">Select type...</option>
                                            {% for t in ['Private Limited','Public Limited','LLP','Sole Proprietorship','Partnership','OPC'] %}
                                            <option value="{{ t }}">{{ t }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    <div
                                        class="col-md-6"
                                        id="website-section"
                                        style="display:none;">

                                        <label class="form-label">
                                            Official Website URL
                                        </label>

                                        <input
                                            id="website-url"
                                            type="url"
                                            name="website"
                                            class="form-control"
                                            placeholder="https://example.com">

                                        <input
                                            type="hidden"
                                            id="logo-url"
                                            name="logo_url">

                                        <small
                                            id="website-help"
                                            class="text-warning">

                                            Multiple companies were found.
                                            Please enter the official website URL.

                                        </small>

                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Email</label>
                                        <input type="email" name="email" class="form-control" placeholder="info@example.com">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Phone</label>
                                        <input type="text" name="phone" class="form-control" placeholder="+91 98765 43210">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Industry</label>
                                        <input type="text" name="industry" class="form-control" placeholder="e.g. Technology">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Company Size</label>
                                        <select name="company_size" class="form-select">
                                            {% for s in ['1-10','11-50','51-200','201-500','500+'] %}
                                            <option value="{{ s }}">{{ s }} employees</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Incorporation Date</label>
                                        <input type="date" name="incorporation_date" class="form-control">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">GST Number</label>
                                        <input type="text" name="gst_number" class="form-control" placeholder="e.g. 07AAAAA1111A1Z1">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">PAN Number</label>
                                        <input type="text" name="pan_number" class="form-control" placeholder="e.g. ABCDE1234F">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">CIN Number</label>
                                        <input type="text" name="cin_number" class="form-control" placeholder="e.g. L12345DL2022PLC123456">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Registration Number</label>
                                        <input type="text" name="registration_number" class="form-control" placeholder="e.g. U72200DL2022PTC12345">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Address</label>
                                        <input type="text" name="address" class="form-control" placeholder="Plot 45, Sector 44">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">City</label>
                                        <input type="text" name="city" class="form-control" placeholder="Gurugram">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">State</label>
                                        <input type="text" name="state" class="form-control" placeholder="Haryana">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">Postal Code</label>
                                        <input type="text" name="postal_code" class="form-control" placeholder="122003">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">Country</label>
                                        <input type="text" name="country" class="form-control" value="India">
                                    </div>
                                    <div class="col-md-6">

                                        <label class="form-label">Company Logo</label>

                                        <img
                                            id="logo-preview"
                                            src=""
                                            class="img-thumbnail mb-2"
                                            style="display:none; max-height:120px;">

                                        <input
                                            type="file"
                                            name="logo"
                                            class="form-control"
                                            accept="image/*">

                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Description</label>
                                        <textarea name="description" class="form-control" rows="3" placeholder="Brief description of operations..."></textarea>
                                    </div>
                                </div>

                                <div class="mt-4 d-flex gap-2">
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="fa-solid fa-save me-2"></i>Save Company
                                    </button>
                                    <a href="/companies/" class="btn btn-outline-secondary px-4">Cancel</a>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="loading-overlay" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,0.85);
z-index:9999;
">

    <div style="
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        text-align:center;
    ">

        <div class="spinner-border text-primary"
             style="width:4rem;height:4rem;">
        </div>

        <h4 class="mt-4">
            Fetching Company Details...
        </h4>

        <p id="loading-text">
            Searching company...
        </p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script>

function showLoading(message) {
    document.getElementById("loading-overlay").style.display = "block";
    document.getElementById("loading-text").innerText = message;
}

function hideLoading() {
    document.getElementById("loading-overlay").style.display = "none";
}

function fillCompanyForm(companyData) {

    document.getElementById("website-url").value =
        companyData.website || "";

    document.querySelector('input[name="email"]').value =
        companyData.emails?.[0] || "";

    document.querySelector('input[name="phone"]').value =
        companyData.phones?.[0] || "";

    document.querySelector('input[name="industry"]').value =
        companyData.industry || "";

    document.querySelector('textarea[name="description"]').value =
        companyData.description || "";

    if (companyData.logo) {

        const logo = document.getElementById("logo-preview");

        logo.src = companyData.logo;

        logo.style.display = "block";

        document.getElementById("logo-url").value =
            companyData.logo;

    }

}

document.getElementById("fetch-company").addEventListener("click", async function () {

    const button = document.getElementById("fetch-company");

    const company = document.getElementById("company-name").value.trim();

    if (!company) {

        alert("Please enter a company name.");

        return;

    }

    button.disabled = true;

    showLoading("Searching company...");

    try {

        const website = document.getElementById("website-url").value.trim();

        // =====================================================
        // WEBSITE ALREADY PROVIDED
        // =====================================================

        if (website !== "") {

            showLoading("Downloading website...");

            const result = await fetch(
                `/company-lookup/lookup?company=${encodeURIComponent(company)}&website=${encodeURIComponent(website)}`
            );

            const companyData = await result.json();

            showLoading("Updating company information...");

            console.log(companyData);

            fillCompanyForm(companyData);

        }

        // =====================================================
        // WEBSITE NOT PROVIDED
        // =====================================================

        else {

            const response = await fetch(
                `/company-lookup/lookup-search?company=${encodeURIComponent(company)}`
            );

            const data = await response.json();

            console.log(data);

            if (data.matches.length === 0) {

                alert("No company found.");

            }

            else if (data.matches.length > 1) {

                document.getElementById("website-section").style.display = "block";

                document.getElementById("website-url").focus();

                document.getElementById("website-url").scrollIntoView({

                    behavior: "smooth",

                    block: "center"

                });

            }

            else {

                showLoading("Fetching company details...");

                const result = await fetch(
                    `/company-lookup/lookup?company=${encodeURIComponent(company)}`
                );

                const companyData = await result.json();

                console.log(companyData);

                fillCompanyForm(companyData);

            }

        }

    }

    catch (error) {

        console.error(error);

        alert("Something went wrong while fetching company details.");

    }

    finally {

        hideLoading();

        button.disabled = false;

        button.innerHTML = "Fetch Details";

    }

});

</script>

</body>
</html>
