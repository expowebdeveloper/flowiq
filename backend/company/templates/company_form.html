<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowIQ – Edit Company</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div id="toast-container"></div>

<div class="wrapper">
    {% include "sidebar.html" %}

    <div class="main">

        <nav class="navbar px-4 py-3">
            <h5 class="mb-0 fw-bold text-slate-800">
                <i class="fa-solid fa-pen-to-square me-2 text-primary"></i>Edit Company Profile
            </h5>
            <a href="/companies/" class="btn btn-sm btn-outline-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Companies
            </a>
        </nav>

        <div class="container-fluid p-4">
            <div class="row justify-content-center">
                <div class="col-xl-9">
                    <div class="card">
                        <div class="card-header">
                            <h6 class="mb-0 fw-bold">Company Profile Details</h6>
                        </div>
                        <div class="card-body p-4">

                            <form action="/companies/{{ company.id }}/edit" method="post" enctype="multipart/form-data">

                                <div class="row g-3">
                                    <div class="col-md-6">

                                        <label class="form-label">Company Name *</label>

                                        <div class="input-group">

                                            <input
                                                id="company-name"
                                                type="text"
                                                name="company_name"
                                                class="form-control"
                                                value="{{ company.company_name }}"
                                                required>

                                            <button
                                                type="button"
                                                id="fetch-company"
                                                class="btn btn-primary">

                                                Fetch

                                            </button>

                                        </div>

                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Company Type</label>
                                        <select name="company_type" class="form-select">
                                            <option value="">Select type...</option>
                                            {% for t in ['Private Limited','Public Limited','LLP','Sole Proprietorship','Partnership','OPC'] %}
                                            <option value="{{ t }}" {% if company.company_type == t %}selected{% endif %}>{{ t }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Website URL</label>
                                        <input type="url" id="website" name="website" class="form-control" value="{{ company.website or '' }}" placeholder="https://example.com">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Email</label>
                                        <input type="email" id="email" name="email" class="form-control" value="{{ company.email or '' }}" placeholder="info@example.com">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Phone</label>
                                        <input type="text" id="phone" name="phone" class="form-control" value="{{ company.phone or '' }}" placeholder="+91 98765 43210">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Industry</label>
                                        <input type="text" id="industry" name="industry" class="form-control" value="{{ company.industry or '' }}" placeholder="e.g. Technology">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Company Size</label>
                                        <select name="company_size" class="form-select">
                                            {% for s in ['1-10','11-50','51-200','201-500','500+'] %}
                                            <option value="{{ s }}" {% if company.company_size == s %}selected{% endif %}>{{ s }} employees</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Incorporation Date</label>
                                        <input type="date" name="incorporation_date" class="form-control" value="{{ company.incorporation_date or '' }}">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">GST Number</label>
                                        <input type="text" name="gst_number" class="form-control" value="{{ company.gst_number or '' }}" placeholder="e.g. 07AAAAA1111A1Z1">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">PAN Number</label>
                                        <input type="text" name="pan_number" class="form-control" value="{{ company.pan_number or '' }}" placeholder="e.g. ABCDE1234F">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">CIN Number</label>
                                        <input type="text" name="cin_number" class="form-control" value="{{ company.cin_number or '' }}" placeholder="e.g. L12345DL2022PLC123456">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Registration Number</label>
                                        <input type="text" name="registration_number" class="form-control" value="{{ company.registration_number or '' }}" placeholder="e.g. U72200DL2022PTC12345">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Address</label>
                                        <input type="text" name="address" class="form-control" value="{{ company.address or '' }}" placeholder="Plot 45, Sector 44">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">City</label>
                                        <input type="text" name="city" class="form-control" value="{{ company.city or '' }}" placeholder="Gurugram">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">State</label>
                                        <input type="text" name="state" class="form-control" value="{{ company.state or '' }}" placeholder="Haryana">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">Postal Code</label>
                                        <input type="text" name="postal_code" class="form-control" value="{{ company.postal_code or '' }}" placeholder="122003">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">Country</label>
                                        <input type="text" name="country" class="form-control" value="{{ company.country or 'India' }}">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Logo Image</label>
                                        <input type="file" name="logo" class="form-control" accept="image/*">
                                        {% if company.logo %}
                                        <div class="mt-2 small text-muted">
                                            Current Logo: <a href="{{ company.logo }}" target="_blank" class="text-decoration-none">{{ company.logo.split('/')[-1] }}</a>
                                        </div>
                                        {% endif %}
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Description</label>
                                        <textarea name="description" id="description" class="form-control" rows="3" placeholder="Brief description of operations...">{{ company.description or '' }}</textarea>
                                    </div>
                                </div>

                                <div class="mt-4 d-flex gap-2">
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="fa-solid fa-save me-2"></i>Update Company
                                    </button>
                                    <a href="/companies/" class="btn btn-outline-secondary px-4">Cancel</a>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script>

document.getElementById("fetch-company").addEventListener("click", async function () {

    const company = document.getElementById("company-name").value.trim();

    if (!company) {

        alert("Please enter a company name.");

        return;

    }

    alert("Searching for " + company);

});

</script>
</body>
</html>
